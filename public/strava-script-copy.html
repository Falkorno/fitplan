<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Copy Strava Google Sheets Script</title>
  <style>
    body{max-width:900px;margin:0 auto;padding:24px;font:16px system-ui,sans-serif;background:#f5f6f1;color:#152019}
    h1{font-size:26px}p{color:#5f6c63;line-height:1.5}button{border:0;border-radius:10px;background:#84cc16;padding:12px 18px;color:#17200e;font-weight:800;cursor:pointer}
    textarea{box-sizing:border-box;width:100%;height:60vh;margin-top:16px;border:1px solid #ccd3cc;border-radius:12px;background:white;padding:14px;font:12px ui-monospace,monospace;color:#152019}
    #status{margin-left:10px;color:#4d7c0f;font-weight:700}
  </style>
</head>
<body>
  <h1>Strava to Google Sheets script</h1>
  <p>Press the button, then open your Google Sheet and choose <b>Extensions → Apps Script</b>. Delete the sample code and paste.</p>
  <button id="copy">Copy complete script</button><span id="status"></span>
  <textarea id="script" readonly aria-label="Strava Google Sheets script">Loading script…</textarea>
  <script>
    const field=document.getElementById('script'),status=document.getElementById('status');
    fetch('/strava-to-google-sheets.txt',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('Could not load script');return response.text()}).then(text=>field.value=text).catch(error=>field.value=error.message);
    document.getElementById('copy').addEventListener('click',async()=>{await navigator.clipboard.writeText(field.value);status.textContent='Copied';setTimeout(()=>status.textContent='',2500)});
  </script>
</body>
</html>
